---
# Tasks file for todo_app role
- name: Ensure prerequisite system packages are installed
  apt:
    name: "{{ system_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Create non-root application group
  group:
    name: "{{ app_group }}"
    state: present
    system: yes

- name: Create non-root application system user
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: yes
    shell: /bin/false
    home: "{{ app_dir }}"
    create_home: no

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Create application subdirectories
  file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - app
    - logs

- name: Deploy application source code files
  copy:
    src: ../../../app/
    dest: "{{ app_dir }}/app/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  notify: Restart todo-app service

- name: Deploy requirements.txt
  copy:
    src: ../../../requirements.txt
    dest: "{{ app_dir }}/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  notify: Restart todo-app service

- name: Install Python dependencies into virtual environment
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart todo-app service

- name: Deploy systemd service configuration from template
  template:
    src: todo-app.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart todo-app service

- name: Ensure todo-app service is started and enabled on boot
  systemd:
    name: "{{ app_name }}"
    state: started
    enabled: yes

- name: Verify application responds to health probe
  uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
    return_content: yes
  register: health_check_result
  until: health_check_result.status == 200
  retries: 5
  delay: 2
