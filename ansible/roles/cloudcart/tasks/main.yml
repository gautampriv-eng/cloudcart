---
- name: Install Java 17 runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Copy application jar
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ app_dir }}/cloudcart.jar"
    owner: "{{ app_user }}"
    mode: "0644"
  notify: Restart cloudcart

- name: Install systemd unit
  ansible.builtin.template:
    src: cloudcart.service.j2
    dest: /etc/systemd/system/cloudcart.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart cloudcart

- name: Enable and start service
  ansible.builtin.systemd:
    name: cloudcart
    enabled: true
    state: started
    daemon_reload: true
